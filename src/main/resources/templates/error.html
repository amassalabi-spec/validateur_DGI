<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erreur | Validateur DGI</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;background:#f8fafc;margin:0;color:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh}
        .box{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:40px;max-width:480px;text-align:center;box-shadow:0 10px 20px rgba(15,23,42,.06)}
        .code{font-size:52px;font-weight:800;color:#e11d48}
        .t{font-size:18px;font-weight:700;margin:10px 0 6px}
        .m{color:#64748b;font-size:14px;line-height:1.6}
        a{display:inline-block;margin-top:18px;padding:11px 20px;border-radius:11px;background:#4f46e5;color:#fff;text-decoration:none;font-weight:700}
    </style>
</head>
<body>
<div class="box">
    <div class="code" th:text="${status} ?: '500'"></div>
    <div class="t">Une erreur inattendue est survenue</div>
    <div class="m" th:text="${message} ?: 'Votre action n&apos;a pas pu aboutir. Veuillez réessayer ou contacter le support.'">Votre action n'a pas pu aboutir. Veuillez réessayer.</div>
    <a th:href="@{/dashboard}">Retour au tableau de bord</a>
</div>
</body>
</html>
