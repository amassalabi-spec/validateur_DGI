<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Créer un compte | Validateur DGI</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;background:#f8fafc;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;width:min(420px,92vw);box-shadow:0 15px 30px rgba(15,23,42,.08)}
        h1{margin:0 0 8px;color:#0f172a}
        p{margin:0 0 20px;color:#64748b;font-size:14px}
        label{display:block;font-size:13px;font-weight:700;color:#334155;margin:14px 0 6px}
        input{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}
        button{width:100%;margin-top:22px;padding:12px 14px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}
        .alert{background:#fee2e2;color:#991b1b;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
        .link{display:block;text-align:center;margin-top:16px;font-size:13px;color:#4f46e5;text-decoration:none;font-weight:600}
        .link:hover{text-decoration:underline}
    </style>
</head>
<body>
<div class="card">
    <h1>Créer un compte</h1>
    <p>Inscrivez-vous pour accéder au workspace, au dashboard et au registre.</p>

    <div th:if="${error}" class="alert" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label for="companyName">Nom de l'entreprise</label>
        <input id="companyName" name="companyName" type="text" autocomplete="organization" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />

        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required />

        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />

        <button type="submit">Créer le compte</button>
    </form>

    <a class="link" th:href="@{/login}">Déjà un compte ? Se connecter</a>
</div>
</body>
</html>
