<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Connexion | Validateur DGI</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;background:#f8fafc;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;width:min(420px,92vw);box-shadow:0 15px 30px rgba(15,23,42,.08)}
        h1{margin:0 0 8px;color:#0f172a}
        p{margin:0 0 20px;color:#64748b;font-size:14px}
        label{display:block;font-size:13px;font-weight:700;color:#334155;margin:14px 0 6px}
        input{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}
        button{width:100%;margin-top:22px;padding:12px 14px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}
        .alert{background:#fee2e2;color:#991b1b;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
        .success{background:#dcfce7;color:#166534}
        .link{display:block;text-align:center;margin-top:16px;font-size:13px;color:#4f46e5;text-decoration:none;font-weight:600}
        .link:hover{text-decoration:underline}
    </style>
</head>
<body>
<div class="card">
    <h1>Validateur DGI</h1>
    <p>Connectez-vous pour accéder au workspace, au dashboard et au registre.</p>

    <div th:if="${param.error}" class="alert">Identifiants invalides.</div>
    <div th:if="${param.logout}" class="alert success">Vous avez été déconnecté.</div>
    <div th:if="${param.registered}" class="alert success">Compte créé avec succès. Connectez-vous.</div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label for="username">Email</label>
        <input id="username" name="username" type="email" autocomplete="username" required />

        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button type="submit">Se connecter</button>
    </form>

    <a class="link" th:href="@{/register}">Pas encore de compte ? Créer un compte</a>
</div>
</body>
</html>
