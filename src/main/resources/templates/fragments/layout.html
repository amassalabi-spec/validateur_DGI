<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="side" th:fragment="sidebar(active)">
    <style>
        .app{display:flex;min-height:100vh}
        .side{width:250px;position:sticky;top:0;height:100vh;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;flex-shrink:0}
        .brand{display:flex;align-items:center;gap:10px;padding:20px}
        .brand .logo{width:34px;height:34px;border-radius:8px;background:#4f46e5;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px}
        .brand .name{line-height:1.1}
        .brand .name strong{display:block;font-size:15px;color:#fff;letter-spacing:-.02em}
        .brand .name span{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#94a3b8}
        .nav{flex:1;overflow-y:auto;padding:0 12px;display:flex;flex-direction:column;gap:2px}
        .nav .group-label{padding:18px 12px 8px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#64748b}
        .nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;color:#cbd5e1;text-decoration:none;font-weight:600}
        .nav a:hover{background:#ffffff14;color:#fff}
        .nav a.on{background:#4f46e5;color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.4)}
        .nav a .ico{width:17px;height:17px;flex-shrink:0;opacity:.9}
        .user-card{margin:12px;border-radius:10px;background:#ffffff0d;padding:12px;display:flex;align-items:center;gap:10px}
        .user-card .avatar{width:32px;height:32px;border-radius:50%;background:#6366f1;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .user-card .uinfo{min-width:0;flex:1}
        .user-card .uinfo strong{display:block;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .user-card .uinfo span{display:block;font-size:10px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .user-card form{margin:0}
        .user-card .logout{background:none;border:0;color:#94a3b8;cursor:pointer;font-size:15px;padding:4px}
        .user-card .logout:hover{color:#fff}
        .mobile-nav{display:none;position:sticky;top:0;z-index:20;background:#0f172a;padding:8px 12px;gap:6px;flex-wrap:wrap}
        .mobile-nav a{color:#cbd5e1;text-decoration:none;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px}
        .mobile-nav a.on{background:#4f46e5;color:#fff}
        .mobile-nav .brand-tag{color:#94a3b8;font-weight:800;margin-right:6px}
        @media (max-width: 900px){.side{display:none}.mobile-nav{display:flex}.app{flex-direction:column}}
    </style>
    <div class="brand">
        <span class="logo">F</span>
        <div class="name">
            <strong>Fiscalys</strong>
            <span>Conformité DGI</span>
        </div>
    </div>
    <nav class="nav">
        <span class="group-label">Navigation</span>
        <a th:classappend="${active == 'dashboard'} ? ' on'" th:href="@{/dashboard}">
            <span class="ico">◈</span>Dashboard BI
        </a>
        <a th:classappend="${active == 'workspace'} ? ' on'" th:href="@{/workspace}">
            <span class="ico">▣</span>Analyser une facture
        </a>
        <a th:classappend="${active == 'registre'} ? ' on'" th:href="@{/invoices}">
            <span class="ico">☰</span>Registre des factures
        </a>
        <a th:classappend="${active == 'studio'} ? ' on'" th:href="@{/studio}">
            <span class="ico">▤</span>Studio PDF
        </a>
        <span class="group-label">Administration</span>
        <a th:classappend="${active == 'profil'} ? ' on'" th:href="@{/profile}">
            <span class="ico">◉</span>Profil fiscal DGI
        </a>
        <a th:classappend="${active == 'equipe'} ? ' on'" th:href="@{/equipe}">
            <span class="ico">☺</span>Équipe
        </a>
        <a th:classappend="${active == 'abonnement'} ? ' on'" th:href="@{/abonnement}">
            <span class="ico">◳</span>Abonnement
        </a>
        <a th:if="${currentUserIsSuperAdmin}" th:classappend="${active == 'admin'} ? ' on'" th:href="@{/admin}">
            <span class="ico">◇</span>Super Admin
        </a>
    </nav>
    <div class="user-card">
        <span class="avatar"
              th:text="${currentUserFullName != null and currentUserFullName != ''} ? ${#strings.substring(currentUserFullName, 0, 2)} : (${currentUserEmail != null} ? ${#strings.toUpperCase(#strings.substring(currentUserEmail, 0, 2))} : 'SB')"></span>
        <div class="uinfo">
            <strong th:text="${currentUserFullName != null and currentUserFullName != ''} ? ${currentUserFullName} : (${currentUserEmail != null} ? ${currentUserEmail} : 'Session non connectée')"></strong>
            <span th:text="${companyName} ?: 'Société non connectée'"></span>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="logout" type="submit" title="Se déconnecter">⏻</button>
        </form>
    </div>
</aside>
<div class="mobile-nav" th:fragment="mobilenav(active)">
    <span class="brand-tag">F</span>
    <a th:classappend="${active == 'dashboard'} ? ' on'" th:href="@{/dashboard}">Dashboard</a>
    <a th:classappend="${active == 'workspace'} ? ' on'" th:href="@{/workspace}">Analyser</a>
    <a th:classappend="${active == 'registre'} ? ' on'" th:href="@{/invoices}">Registre</a>
    <a th:classappend="${active == 'studio'} ? ' on'" th:href="@{/studio}">Studio PDF</a>
    <a th:classappend="${active == 'profil'} ? ' on'" th:href="@{/profile}">Profil</a>
    <a th:classappend="${active == 'equipe'} ? ' on'" th:href="@{/equipe}">Équipe</a>
    <a th:classappend="${active == 'abonnement'} ? ' on'" th:href="@{/abonnement}">Abonnement</a>
    <a th:if="${currentUserIsSuperAdmin}" th:classappend="${active == 'admin'} ? ' on'" th:href="@{/admin}">Super Admin</a>
</div>
</body>
</html>
