server.port=8086
spring.datasource.url=jdbc:mysql://localhost:3305/validation?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&sslMode=DISABLED
spring.datasource.username=root
spring.datasource.password=${BD_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# JWT Configuration qui permet de generer un token JWT pour l'authentification
app.jwt.secret=your-secret-key-here-minimum-32-characters-for-hs256
app.jwt.validity=86400000

# Super Admin de la plateforme (separateur: virgule). Ces utilisateurs peuvent
# consulter le dashboard global /admin (liste de tous les clients/entreprises).
# Le role de base reste ROLE_ADMIN de leur entreprise; ROLE_SUPER_ADMIN est rajoute a la connexion.
app.super.admin.emails=oalmajir@gmail.com

# Server configuration
server.servlet.context-path=/
spring.application.name=validateur-dgi

# Securite: ne jamais exposer la pile d'erreurs Java dans le navigateur
server.error.include-stacktrace=never

# Logging
logging.level.root=INFO
logging.level.com.audit.dgi.validateur_dgi=DEBUG

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring AI via l'API Gemini (Google GenAI).
# Cle fournie par la variable d'environnement GEMINI_API_KEY (placeholder resolue par Spring).
# Defaut non-vide pour ne pas bloquer le demarrage; sans cle, la candidate echoue et le parser
# regex de "FallbackParsingService" prend le relais de maniere transparente.
# Modele "flash" = rapide et economique en tokens.
# project-id/location: exiges par le bean VertexAI au demarrage (ignores en mode API-key GCP).
spring.ai.vertex.ai.gemini.api-key=${GEMINI_API_KEY}
spring.ai.vertex.ai.gemini.project-id=validateur-dgi-demo
spring.ai.vertex.ai.gemini.location=global
spring.ai.vertex.ai.gemini.chat.options.model=gemini-2.5-flash
spring.ai.vertex.ai.gemini.chat.options.temperature=0.1
spring.ai.vertex.ai.gemini.chat.options.max-output-tokens=2000

